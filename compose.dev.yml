services:
  postgres-dev:
    image: pgvector/pgvector:pg18
    container_name: quizcit-postgres-dev
    environment:
      POSTGRES_DB: quizcit_dev
      POSTGRES_USER: quizcit_dev
      POSTGRES_PASSWORD: quizcit_dev
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizcit_dev -d quizcit_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - quizcit-postgres-dev-data:/var/lib/postgresql

  redis-dev:
    image: redis:7-alpine
    container_name: quizcit-redis-dev
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - quizcit-redis-dev-data:/data

volumes:
  quizcit-postgres-dev-data:
  quizcit-redis-dev-data:

