spring:
  application:
    name: quizcit-backend
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:2000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:30000}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # Remote PostgreSQL/Supabase connections can be reset while Flyway waits
    # for an advisory lock. Fail/reconnect sooner instead of holding one socket
    # for roughly a minute.
    connect-retries: 3
    connect-retries-interval: 2s
    lock-retry-count: 5
  mail:
    host: ${SPRING_MAIL_HOST:smtp.resend.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

quizcit:
  ai:
    base-url: ${QUIZCIT_AI_BASE_URL:http://localhost:8000}
  auth:
    token:
      secret: ${QUIZCIT_AUTH_TOKEN_SECRET}
      expiration-seconds: ${QUIZCIT_AUTH_TOKEN_EXPIRATION_SECONDS:86400}
    otp:
      from-address: ${QUIZCIT_OTP_FROM_ADDRESS:no-reply@localhost}
      token-secret: ${QUIZCIT_OTP_TOKEN_SECRET}
      expiration-seconds: ${QUIZCIT_OTP_EXPIRATION_SECONDS:300}

app:
  database:
    migration:
      max-attempts: 4
      retry-delay-ms: 1500
