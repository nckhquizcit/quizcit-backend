spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:2000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:30000}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # Remote PostgreSQL/Supabase connections can be reset while Flyway waits
    # for an advisory lock. Fail/reconnect sooner instead of holding one socket
    # for roughly a minute.
    connect-retries: 3
    connect-retries-interval: 2s
    lock-retry-count: 5

app:
  database:
    migration:
      max-attempts: 4
      retry-delay-ms: 1500
