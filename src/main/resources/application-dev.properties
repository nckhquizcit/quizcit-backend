spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/quizcit_dev
spring.datasource.username=quizcit_dev
spring.datasource.password=quizcit_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# Development migrations must only target the Docker database above.
spring.flyway.enabled=true
# The cloned production schema currently contains legacy drift outside Auth/User
# (for example user_achievement). Never let Hibernate mutate it implicitly;
# migrations and focused schema checks are the source of truth in dev.
spring.jpa.hibernate.ddl-auto=none

quizcit.auth.token.secret=${QUIZCIT_AUTH_TOKEN_SECRET:quizcit-dev-access-token-secret-at-least-32-bytes}
quizcit.auth.token.expiration-seconds=900
quizcit.auth.otp.token-secret=${QUIZCIT_OTP_TOKEN_SECRET:quizcit-dev-otp-token-secret-at-least-32-bytes}

# Do not accidentally use production integrations while running locally.
quizcit.ai.base-url=${QUIZCIT_AI_BASE_URL:http://127.0.0.1:8000}
spring.mail.host=${QUIZCIT_MAIL_HOST:localhost}
spring.mail.port=${QUIZCIT_MAIL_PORT:1025}
spring.mail.username=${QUIZCIT_MAIL_USERNAME:}
spring.mail.password=${QUIZCIT_MAIL_PASSWORD:}
quizcit.auth.otp.from-address=${QUIZCIT_MAIL_FROM:no-reply@localhost}
spring.data.redis.host=${QUIZCIT_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${QUIZCIT_REDIS_PORT:6379}
spring.data.redis.password=${QUIZCIT_REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

